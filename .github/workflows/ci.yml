name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Tests
        run: pytest -q
      - name: CLI smoke test
        run: |
          dedupe generate --n 2000 --out records.csv
          dedupe run records.csv --out matches.csv
